server {
    listen 80;
    server_name yy.yaml.uk;
    root /www/wwwroot;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location = /openclash-editor {
        return 301 /openclash-editor/;
    }

    location ^~ /openclash-editor/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=300" always;
    }

    access_log /www/wwwlogs/openclash-editor-http.log;
    error_log /www/wwwlogs/openclash-editor-http-error.log;
}

server {
    listen 9443 ssl;
    server_name yy.yaml.uk;
    root /www/wwwroot;

    ssl_certificate /root/cert/openclash-editor-rsa/fullchain.pem;
    ssl_certificate_key /root/cert/openclash-editor-rsa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OpenClashEditorTLS:10m;
    ssl_session_timeout 10m;

    location = /openclash-editor {
        return 301 /openclash-editor/;
    }

    location ^~ /openclash-editor/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=300" always;
    }

    access_log /www/wwwlogs/openclash-editor.log;
    error_log /www/wwwlogs/openclash-editor-error.log;
}
