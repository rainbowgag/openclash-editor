server {
    listen 80;
    server_name 1.ylove.cc 64.83.19.162;
    root /var/www/openclash-editor;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location = /openclash-editor {
        return 301 /openclash-editor/;
    }

    location ^~ /openclash-editor/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=300" always;
    }
}

server {
    listen 443 ssl http2;
    server_name 1.ylove.cc;
    root /var/www/openclash-editor;

    ssl_certificate /etc/letsencrypt/live/1.ylove.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1.ylove.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OpenClashEditorTLS:10m;
    ssl_session_timeout 10m;

    location = /openclash-editor {
        return 301 /openclash-editor/;
    }

    location ^~ /openclash-editor/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=300" always;
    }
}
